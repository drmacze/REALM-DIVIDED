name: Deploy Realm Divided

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Other Project artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat assets/directive-i-other-project-b64/part-* | tr -d '\n\r ' | base64 --decode > assets/directive-i-other-project.webp
          test -s assets/directive-i-other-project.webp
          rm -rf assets/directive-i-other-project-b64

      - name: Generate build info
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          printf '{\n  "status": "deployed",\n  "build": "%s",\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
